[project]
name = "topopuzzle-api"
version = "0.1.0"
description = "FastAPI backend for TopoPuzzle Studio."
requires-python = ">=3.11"
dependencies = [
    "topopuzzle-mesh",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
