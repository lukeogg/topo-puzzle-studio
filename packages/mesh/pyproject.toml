[project]
name = "topopuzzle-mesh"
version = "0.1.0"
description = "Geometry core, providers, and CLI for TopoPuzzle Studio — 3D-printable topographic terrain puzzles."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TopoPuzzle Studio contributors" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "trimesh>=4.4",
    "manifold3d>=2.5",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pillow>=10.0",
    "requests>=2.31",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
topopuzzle = "topopuzzle_mesh.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topopuzzle_mesh"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
